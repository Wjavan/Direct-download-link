name: Version Consistency Check

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: "Check @version vs const VERSION"
        run: |
          v1=$(sed -n 's/.*@version[ \t]\+\([0-9.]\+\).*/\1/p' "网盘直链下载助手.user.js")
          v2=$(sed -n "s/.*const VERSION = '\([0-9.]\+\)'.*/\1/p" "网盘直链下载助手.user.js")
          echo "@version=$v1  const VERSION=$v2"
          [ "$v1" = "$v2" ] || { echo "::error::@version ($v1) 与 const VERSION ($v2) 不一致"; exit 1; }
